<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Learning Sounds</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230b0d12%22/%3E%3Cpath d=%22M3 16h5l3-8 5 16 4-12 3 4h6%22 fill=%22none%22 stroke=%22%23b6ff4a%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="led on"></span>
      <h1>LEARNING<span>SOUNDS</span></h1>
    </div>
    <div class="lcd" id="lcd">
      <div class="lcd-row"><span class="lcd-label">NOW</span><span id="lcdNow">— READY —</span></div>
      <div class="lcd-row"><span class="lcd-label">SCORE</span><span id="lcdScore">000</span></div>
    </div>
  </header>

  <div class="scope-wrap">
    <canvas id="scope"></canvas>
    <div class="scope-grid"></div>
  </div>

  <nav class="transport">
    <button class="tbtn active" data-view="rack"><span class="tico">▦</span> RACK</button>
    <button class="tbtn" data-view="quiz"><span class="tico">◉</span> QUIZ</button>
    <button class="tbtn stopbtn" id="stopBtn" title="Stop"><span class="tico">■</span></button>
  </nav>

  <main>
    <section id="view-rack" class="view active">
      <div class="channels" id="genreFilter"></div>
      <div class="pads" id="pads"></div>
      <p class="hint"><button class="linkbtn" id="copyStarts">📋 Copy my saved start times</button><br>Tap a pad to hear it · tap <b>ⓘ</b> to open its card · no sound on iPhone? switch off silent mode</p>
    </section>

    <section id="view-quiz" class="view">
      <div id="quizSetup" class="panel">
        <h2>Choose a mode</h2>
        <div class="modes">
          <button class="mode" data-mode="name"><b>Name that sound</b><small>Hear it, pick its name</small></button>
          <button class="mode" data-mode="genre"><b>Which genre?</b><small>Hear it, pick its home genre</small></button>
          <button class="mode" data-mode="mixed"><b>Mixed</b><small>Both, shuffled</small></button>
        </div>
        <p class="best" id="bestScore"></p>
      </div>

      <div id="quizRound" class="panel hidden">
        <div class="qhead">
          <span class="step" id="qStep">1 / 10</span>
          <div class="meter" id="qMeter"></div>
        </div>
        <h2 id="qPrompt">What is this sound called?</h2>
        <button class="bigpad" id="qPlay"><span class="ring"></span><span class="bp-label">▶ PLAY</span></button>
        <p class="clue hidden" id="qClue"></p>
        <div class="options" id="qOptions"></div>
        <div class="reveal hidden" id="qReveal"></div>
        <button class="next hidden" id="qNext">NEXT ▸</button>
      </div>

      <div id="quizEnd" class="panel hidden">
        <h2>Session complete</h2>
        <div class="final" id="qFinal"></div>
        <button class="next" id="qAgain">PLAY AGAIN</button>
      </div>
    </section>
  </main>

  <div class="modal hidden" id="modal">
    <div class="modal-bg" data-close></div>
    <div class="flip" id="flip">
      <div class="face front" id="cardFront"></div>
      <div class="face back" id="cardBack"></div>
    </div>
  </div>

  <script src="js/cards.js?v=18"></script>
  <script src="js/contrasts.js?v=18"></script>
  <script src="js/sounds.js?v=18"></script>
  <script src="js/app.js?v=18"></script>
</body>
</html>
